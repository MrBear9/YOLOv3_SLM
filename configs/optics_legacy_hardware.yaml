# 独立对照配置：旧数组传播 + 旧 linspace 核 + 硬件 8/4.5 μm 间隔。
# 教师与学生在此配置下从头训练；不复用 13/6.4 μm 或 physical 配对。
resolution:
- 640
- 640
dmd:
  pixel_pitch_um: 5.4
  relay_magnification: 1.0
hardware:
  wavelength_nm: 532
  profiles:
    zk_weixing_8p0:
      model: 中科微兴
      resolution:
      - 1080
      - 1920
      pixel_pitch_um: 8.0
      fill_factor_pct: 87
    magicholo_4p5:
      model: MagicHolo
      resolution:
      - 1080
      - 1920
      pixel_pitch_um: 4.5
      fill_factor_pct: 91
propagation:
  num_layers: 2
  coordinate_mode: legacy
  asm_kernel: legacy
  padding_factor: 2
  supersample_factor: 1
  sampling_pitch_um:
    zk_weixing_8p0: null  # 跟随 hardware.profiles 的 8.0 μm
    magicholo_4p5: null  # 跟随 hardware.profiles 的 4.5 μm
  layers:
  - profile: zk_weixing_8p0
    distance_cm: 20
  - profile: magicholo_4p5
    distance_cm: 10
  - profile: magicholo_4p5
    distance_cm: 10
  - profile: magicholo_4p5
    distance_cm: 10
phase_export:
  levels: 256
  gray_inverted: true
  phase_offset_pi: 1.0
  gray_to_phase_lut: null
